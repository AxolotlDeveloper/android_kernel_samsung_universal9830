version: 2.1

jobs:
  build:
    docker:
      - image: circleci/android:api-29
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev
      - run:
          name: Compile kernel
          command: |
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
